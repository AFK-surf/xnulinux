# SPDX-License-Identifier: GPL-2.0-only
# Build the hosted system's Metal plugin (gpu/xnu-cpu-metal: XnuCpuMetal.bundle, universal arm64 + arm64e, lavapipe only)
# on a macOS runner and keep it as an artifact. Nothing of Apple's is in it: metal2vulkan, the Vulkan loader, Mesa and
# LLVM are fetched at the revisions scripts/fetch-sources.sh pins. The arm64e LLVM takes most of the time and is cached.
name: metal-plugin
on:
  workflow_dispatch:
  push:
    branches: [ci/metal-plugin]
    paths:
      - .github/workflows/metal-plugin.yml
      - gpu/xnu-cpu-metal/**
jobs:
  bundle:
    runs-on: macos-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: gpu/xnu-cpu-metal
    steps:
      - uses: actions/checkout@v4
      - name: Host
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sw_vers; uname -m; xcodebuild -version; xcrun --show-sdk-path; sysctl -n hw.ncpu hw.memsize; df -h . | tail -1
      - name: Tools (Homebrew, Python, Rust)
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install meson ninja cmake pkgconf bison flex glslang zstd
          brew install llvm@22 || brew install llvm
          # the scripts name Homebrew's LLVM as llvm@22 (llvm-config for the arm64 lavapipe, llvm-objcopy)
          [ -e /opt/homebrew/opt/llvm@22 ] || ln -s "$(brew --prefix llvm)" /opt/homebrew/opt/llvm@22
          /opt/homebrew/opt/llvm@22/bin/llvm-config --version
          mkdir -p build/vk-deps/bin
          "$(brew --prefix python3)/bin/python3" -m venv build/pyvenv
          build/pyvenv/bin/pip -q install mako pyyaml packaging
          # Mesa wants a newer bison and flex than macOS has
          ln -sf "$(brew --prefix bison)/bin/bison" "$(brew --prefix flex)/bin/flex" build/vk-deps/bin/
          rustup toolchain install 1.100.0 --profile minimal
          rustup toolchain install nightly-aarch64-apple-darwin --profile minimal --component rust-src
      - name: Sources
        run: scripts/fetch-sources.sh
      - name: Vulkan headers and loader (arm64, arm64e)
        run: |
          export PATH="$PWD/build/pyvenv/bin:/opt/homebrew/bin:$PATH"
          git clone -q --depth 1 --branch vulkan-sdk-1.4.363.0 https://github.com/KhronosGroup/Vulkan-Headers.git build/Vulkan-Headers
          cmake -G Ninja -S build/Vulkan-Headers -B build/Vulkan-Headers/build -DCMAKE_INSTALL_PREFIX="$PWD/build/vk-deps/vulkan-headers/1.4.363.0"
          ninja -C build/Vulkan-Headers/build install
          scripts/build-vkloader-arm64e.sh
          # build-m2v.sh stages the arm64 loader from here
          mkdir -p build/vk-deps/vulkan-loader/1.4.363.0/lib
          cp -f build/vkloader-arm64-install/lib/libvulkan.1.4.363.dylib build/vk-deps/vulkan-loader/1.4.363.0/lib/
      - name: lavapipe (arm64)
        run: scripts/build-lavapipe.sh
      - name: metal2vulkan bridge (arm64)
        run: scripts/build-m2v.sh
      - name: LLVM for arm64e (cache)
        id: llvm
        uses: actions/cache@v4
        with:
          path: gpu/xnu-cpu-metal/build/llvm-arm64e-install
          key: llvm-arm64e-${{ runner.os }}-${{ hashFiles('gpu/xnu-cpu-metal/scripts/fetch-sources.sh', 'gpu/xnu-cpu-metal/scripts/build-llvm-arm64e.sh') }}
      - name: LLVM for arm64e
        if: steps.llvm.outputs.cache-hit != 'true'
        run: |
          scripts/build-llvm-arm64e.sh
          rm -rf build/llvm-arm64e
      - name: lavapipe (arm64e)
        run: scripts/build-lavapipe-arm64e.sh
      - name: metal2vulkan bridge (arm64e)
        run: scripts/build-m2v-arm64e.sh
      - name: Bundle
        run: |
          scripts/build-bundle-universal.sh
          tar -C dist -czf "$RUNNER_TEMP/XnuCpuMetal.bundle.tar.gz" XnuCpuMetal.bundle
          shasum -a 256 "$RUNNER_TEMP/XnuCpuMetal.bundle.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: XnuCpuMetal.bundle
          path: ${{ runner.temp }}/XnuCpuMetal.bundle.tar.gz
      - name: Render test on the runner (informative)
        continue-on-error: true
        run: scripts/test-render-ci.sh arm64
